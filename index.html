<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sintonia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .destaque {
            color: #39ff88;
        }

        p {
            color: #cfcfcf;
            font-size: 18px;
            line-height: 1.5;
        }

        .botao {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 28px;
            border-radius: 30px;
            background: #39ff88;
            color: #080808;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
        }

        .aviso {
            margin-top: 28px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>
            <span class="destaque">Sin</span>tonia
        </h1>

        <p>
            Conecte-se com novas pessoas através do Sintonia.
        </p>

        <a
            class="botao"
            href="sintonia://profile">
            Abrir no Sintonia
        </a>

        <div class="aviso">
            Plataforma destinada exclusivamente a maiores de 18 anos.
        </div>

    </main>

</body>
</html>
